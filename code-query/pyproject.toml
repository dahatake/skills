[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-query-gui"
version = "0.2.0"
description = "Standalone management GUI for the Code Query Skill"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
watch = ["watchdog>=4.0"]
tokenizer = ["tiktoken>=0.7.0"]

[project.scripts]
code-query-gui = "cq.gui.__main__:main"

[tool.setuptools.packages.find]
where = ["vendor"]
include = ["cq*"]
