# Distribution kit manifest for Tool Search.
#
# markdown-query / code-query と同じ同梱 `kit/` を共有する。
# 索引を持たず Skill 定義も同梱しないため、その 2 点だけ既定と異なる。

[kit]
engine = "toolsearch"
skill = "tool-search"
venv = ".venv-toolsearch"
# 設定ファイルは vendor/toolsearch/policy.json（同梱物）。リポジトリルートには生成しない。
config = "vendor/toolsearch/policy.json"
config_supports_profile = false
supports_index = false

base_dependencies = ["pydantic>=2"]
gui_dependencies = []
watch_dependencies = []
tokenizer_dependencies = ["tiktoken>=0.7.0"]
